services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: principalbm
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - crm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d principalbm"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  crm_data:
